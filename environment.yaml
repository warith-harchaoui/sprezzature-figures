# Local dev, conda/mamba. Deliberately thin: conda only pins the interpreter
# and pip itself, then hands off every actual dependency to requirements.txt
# (which pip-installs this package's [cli,dataviz,studio] extras). This keeps
# one source of truth — pyproject.toml — instead of a second, drifting list
# of conda-format package specs.
#
# Usage:
#   conda env create -f environment.yaml   # first time
#   conda env update -f environment.yaml --prune   # after requirements.txt changes
#   conda activate sprezzature-figures
#
# For test/lint tooling on top, run inside the activated env:
#   pip install -r requirements-dev.txt
#   playwright install chromium   # one-time, for the headless-Chromium checks
name: sprezzature-figures
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
