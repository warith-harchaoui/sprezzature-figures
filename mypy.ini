# mypy.ini — the type half of this package's gate, the counterpart to ruff.
#
# Added 2026-10-02, once the package and scripts/ both reached zero. They did
# not start there: 119 findings, and three of them were real.
#
#   * Four `run.io_bound` call sites in the studio editor used the result
#     without checking it. NiceGUI's own docstring says that call returns None
#     when cancelled or shutting down, so closing a tab mid-render raised
#     AttributeError inside the handler.
#   * `make_radial-bar` and thirteen other generators gave one name two
#     meanings inside a single function.
#   * Five generators declared their rows `Dict[str, object]` where the
#     dispatcher passes `dict[str, Any]`, which is what twenty
#     `# type: ignore` comments were silencing.
#
# Deliberately the same pragmatic settings as the monorepo, not `--strict`:
# full signatures are required, third-party stubs are not.
[mypy]
python_version = 3.10
# The local-AI and plotting paths lazily import heavy optional backends that
# are not in the light CI lane. Check the code's OWN annotations, not stubs.
ignore_missing_imports = True
warn_redundant_casts = True
# Every def carries a full signature — no untyped or partially-typed functions.
disallow_untyped_defs = True
disallow_incomplete_defs = True
# warn_unused_ignores stays OFF on purpose: with ignore_missing_imports,
# whether a `# type: ignore` on an optional-backend import is "used" depends on
# whether that dependency happens to be installed, so it fires falsely in CI
# while being correct in a dev environment where the backends are present.
#
# scripts/ is checked as its own invocation: the scripts add their own dir to
# sys.path at runtime and import siblings by bare name (`from _click import …`),
# which only resolves when that directory is the check's root.

# Known condition, no workaround in here on purpose. numpy arrives through
# pydantic's type graph; nothing in this package imports it. numpy >= 2.3 ships
# stubs written with PEP 695 `type` statements, which mypy accepts only from
# python_version 3.12, while this file pins 3.10 to keep checking against the
# oldest Python the package supports. So on a machine that happens to have
# numpy installed, mypy stops inside a third-party stub having checked none of
# our code; CI installs no numpy and is green.
#
# `[mypy-numpy.*] follow_imports = skip` does not help: the failure is a parse
# of the stub, which happens before per-module settings apply. The fixes that
# would work are both wrong here: raising python_version stops catching
# 3.11+-only syntax in our own code, and `--follow-imports=skip` for the whole
# run weakens every real check. The pre-push hook tolerates this one shape of
# failure, narrowly, and nothing else; see `.githooks/pre-push`.
