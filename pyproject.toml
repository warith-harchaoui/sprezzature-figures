[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-figures"
version = "1.0.0"
description = "Publication-quality data figures for the sprezzature stack: 84+ chart types rendered via Vega-Lite, full Vega, or matplotlib/SVG. Includes the Ralph Eyeball Loop for autonomous visual quality feedback."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"},
]
keywords = ["figures", "vega", "vega-lite", "data-visualization", "charts", "sprezzature", "matplotlib", "svg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "vl-convert-python>=1.6",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Full dataviz stack (matplotlib, networkx, wordcloud, etc.)
dataviz = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "wordcloud>=1.9",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]
# Causal inference (make_causal_estimate.py)
causal = [
    "dowhy>=0.11",
    "econml>=0.14",
]
# Explainability (explain_model.py)
explain = [
    "shap>=0.44",
    "shapash>=2.6",
]
# Local VLM critique (ralph_eyeball_loop.py --local mode)
local = ["requests>=2.31"]
# Developer extras
dev = [
    "pytest>=8",
    "ruff",
    "vl-convert-python>=1.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.scripts]
sprezzature-figures = "sprezzature_figures.cli:main"
make-figure = "sprezzature_figures.make_figure:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-figures"
Issues = "https://github.com/warith-harchaoui/sprezzature-figures/issues"
Changelog = "https://github.com/warith-harchaoui/sprezzature-figures/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["sprezzature_figures", "sprezzature_figures_scripts"]

[tool.setuptools.package-dir]
"sprezzature_figures_scripts" = "scripts"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that render actual figures (may take several seconds)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
