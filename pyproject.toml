[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-figures"
version = "2.4.0"
description = "Publication-quality data figures for the sprezzature stack: 127 hand-authored, interactive SVG chart types plus explainability, causality, and diagram rendering, every one authored as SVG directly. Includes the Ralph Eyeball Loop for autonomous visual quality feedback."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"},
]
keywords = ["figures", "data-visualization", "charts", "sprezzature", "svg", "hand-authored-svg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "resvg-py>=0.3",
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Click twin of the always-installed argparse `make-figure` CLI
cli = [
    "click>=8.1",
]
# Sprezzature Studio: NiceGUI app, data ingest, LLM-driven chat editing,
# and the Ralph visual-critique loop. `from sprezzature_figures import
# make_figure` must keep working without this extra installed.
studio = [
    "nicegui",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "charset-normalizer>=3",
    "best-engine-ai-helper>=0.4.0",
    "os-helper>=1.8.0",
    "langdetect>=1.0.9",
]
# Data-side support for the 127-kind catalogue, explainability and
# causality. Nothing here draws: every figure is authored as SVG directly,
# so this tier is tables, geometry and models only.
dataviz = [
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6",
    "shapely>=2",
    "pyproj>=3.6",
]
# Causal inference (make_causal_estimate.py)
causal = [
    "dowhy>=0.11",
    "econml>=0.14",
]
# Explainability (explain_model.py)
explain = [
    "shap>=0.44",
    "shapash>=2.6",
]
# Local VLM critique (ralph_eyeball_loop.py --local mode). Every LLM/VLM
# call across sprezzature-* routes through best_engine_ai_helper.llm.chat,
# which itself defaults to a local Ollama backend -- no cloud API required.
local = ["best-engine-ai-helper>=0.4.0"]
# FastAPI HTTP surface (sprezzature_figures/api.py) -- GET /kinds,
# GET /kinds/{kind}, POST /render/{kind}.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface via fastapi-mcp (sprezzature_figures/mcp.py) -- mounts the
# FastAPI app as MCP tools so any MCP-aware host can call them directly.
mcp = [
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4.0 (the latest as of 2026-08) declares mcp>=1.12.0 with
    # no upper bound, but calls mcp's Server(name, description) positionally
    # -- mcp 2.0.0 made `description` keyword-only, so an unconstrained
    # resolve breaks FastApiMCP(...) at construction time (verified: pip
    # happily installs mcp 2.0.0 alongside fastapi-mcp 0.4.0, and
    # `sprezzature_figures.mcp` then raises TypeError on import). Pin below
    # 2.0 until fastapi-mcp ships a fix.
    "mcp<2.0",
]
# Developer extras
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "build",
    # tests/test_linter_is_not_blind.py reads a nested pyproject table, and
    # `tomllib` only joined the standard library in 3.11.
    "tomli; python_version < '3.11'",
    "numpy>=1.24",
    # headless-Chromium checks: scripts/render_gapminder_og.py, the Ralph
    # eyeball loop, gallery-interactivity verification. Needs a one-time
    # `playwright install chromium` after this installs, pip can't do that part.
    "playwright>=1.40",
]

[project.scripts]
sprezzature-figures = "sprezzature_figures.cli:main"
make-figure = "sprezzature_figures.make_figure:main"
sprezzature-studio = "sprezzature_figures.studio.cli:main"
sprezzature-figures-mcp = "sprezzature_figures.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-figures"
Issues = "https://github.com/warith-harchaoui/sprezzature-figures/issues"
Changelog = "https://github.com/warith-harchaoui/sprezzature-figures/blob/main/CHANGELOG.md"

[tool.setuptools]
# Authoritative package-data. Left at its pyproject default of true,
# setuptools sweeps in every file sitting inside a package directory and
# treats package-data as additive, so narrowing the font globs below had no
# effect at all: the 12.2 MB of Roboto Serif kept shipping.
include-package-data = false
packages = [
    "sprezzature_figures",
    "sprezzature_figures.catalog",
    "sprezzature_figures.core",
    "sprezzature_figures.studio",
    "sprezzature_figures.studio.ingest",
    "sprezzature_figures.studio.assistant",
    "sprezzature_figures.studio.ralph",
    "sprezzature_figures.studio.pages",
    "sprezzature_figures.studio.components",
    "sprezzature_figures.studio.export",
    "sprezzature_figures.studio.recommendation",
    "sprezzature_figures_scripts",
    "sprezzature_figures_fonts",
]

[tool.setuptools.package-dir]
"sprezzature_figures_scripts" = "scripts"
"sprezzature_figures_fonts" = "assets/fonts"

[tool.setuptools.package-data]
"sprezzature_figures.catalog" = ["figures.json"]
# install_figures.py resolves these at runtime to pip-install a tier.
"sprezzature_figures_scripts" = ["requirements-*.txt"]
# Faces listed one family at a time rather than "*.ttf"/"*.woff2", for two
# reasons. Roboto Serif is 12.2 MB of the 18.6 MB a blanket glob shipped,
# and neither theme asks for it: `corporate` is sans+mono, `academic` is
# Latin Modern, and nothing in scripts/ or the package references the
# "serif" face key. The web app self-hosts its own copy. And a licence has
# to travel with the font it covers: "OFL-*.txt" matched the three Roboto
# licences but not GUST-FONT-LICENSE-LatinModern.txt, so the four Latin
# Modern faces were shipping without theirs.
"sprezzature_figures_fonts" = [
    "Roboto-*.ttf",
    "Roboto-*.woff2",
    "RobotoMono-*.ttf",
    "RobotoMono-*.woff2",
    "LatinModern*.ttf",
    "LatinModern*.woff2",
    "OFL-Roboto.txt",
    "OFL-RobotoMono.txt",
    "GUST-FONT-LICENSE-*.txt",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow and not packaging and not llm and not vision'"
markers = [
    "slow: tests that render actual figures (may take several seconds)",
    "packaging: builds a wheel and installs it in a fresh venv (network + several seconds)",
    "llm: hits a live text LLM through best-engine-ai-helper (skips if unreachable; never run in CI)",
    "vision: hits a live vision model / VLM through best-engine-ai-helper (skips if unreachable; never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Only generated art is out of scope. `scripts/` and `tests/` used to be
# excluded here too, and that made the gate meaningless: `scripts/` is 82 000
# of this package's 102 000 lines of Python, every make_* generator plus the
# auditor and the eyeball loop, and it ships in the wheel as
# `sprezzature_figures_scripts`. "All checks passed" was green because ruff
# was not looking. It looks now; the noise is handled per-file below rather
# than by hiding the directory.
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    # FastAPI reads a Pydantic model instance in a parameter default as "this
    # body is optional"; it is the framework's own idiom, not a shared mutable.
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The 127 generators were written before this repo had a linter. Everything
# that catches a real mistake runs on them -- pyflakes, the bugbear checks,
# ambiguous names, imports stranded mid-module. What is silenced here is
# syntax modernisation and ordering: 3 117 `typing.Dict` -> `dict`, 464
# `Optional[X]` -> `X | None`, 144 import-sort rewrites. Turning those on
# would bury the next real finding under four thousand cosmetic ones, and a
# reformat of that size across live generators is its own decision, not a
# side effect of switching the linter on.
#
# B905 (`zip()` without `strict=`) was silenced here as a named debt and is
# paid off: all 99 call sites are explicit. 85 pair sequences that are
# parallel by construction and say `strict=True`, so a length mismatch raises
# instead of silently dropping the tail and drawing a chart that looks right.
# 14 are sliding pairs (`zip(xs, xs[1:])`) where the short end is the point
# and say `strict=False`. The 127 figures all still render.
"scripts/*" = ["UP", "I001", "C4", "SIM", "W"]
