[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-figures"
version = "2.7.0"
description = "Publication-quality data figures for the sprezzature stack: 167 hand-authored, interactive SVG chart types plus explainability, causality, and diagram rendering, every one authored as SVG directly. Includes the Ralph Eyeball Loop for autonomous visual quality feedback."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["figures", "data-visualization", "charts", "sprezzature", "svg", "hand-authored-svg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "resvg-py>=0.3",
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.7",
    # The command line, and the only parser since 2026-10-25.
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 6
    # dependencies, so `pip install sprezzature-figures` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "dowhy>=0.11",
    "econml>=0.14",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6",
    "shapely>=2",
    "pyproj>=3.6",
    "elbow-helper>=0.4,<1",
    "standpoint>=0.13,<1",
    "shap>=0.44",
    "shapash>=2.6",
    "timeshap>=1.0.4",
    "lime>=0.2.0",
    "joblib>=1.3",
    "best-engine-ai-helper>=0.4.0",
    # 1.3.2, like the three siblings that use this ledger. Up to 1.3.1,
    # `SqliteLedger.__init__` ran `PRAGMA journal_mode=WAL`, which SQLite
    # refuses with SQLITE_BUSY *without consulting the busy handler*, so the
    # connection's timeout did not cover it and a cold start under concurrency
    # could leave one process dead on "database is locked".
    #
    # The retry in `scripts/ralph_eyeball_loop.py` stays, for the branch that
    # owes nothing to a release: a file that is not a database. Raising the
    # floor removed the cause, not the defence.
    "wallet-helper>=1.3.2,<2",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
    "nicegui",
    "openpyxl>=3.1",
    "charset-normalizer>=3",
    "os-helper>=4.0.0,<5",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Developer extras
dev = [
    "pytest>=8",
    "ruff",
    # Bounded on 2026-10-31, and the reason is three lines away in this file's own
    # history: a tool resolved to "whatever is newest" is a red suite waiting for
    # somebody else's release day. mypy 2.4.1 is out, this machine has 1.20.2, and
    # a runner installs the former -- a whole major apart. It broke exactly one
    # brick (`sprezzature-figures`, an inference cycle mypy 1 guessed through and 2
    # reports), which is one more than zero and was invisible until measured.
    #
    # A floor as well as a ceiling: bare `mypy` was not even a floor, so a resolver
    # was free to reach for an ancient one. Raise the ceiling deliberately, after
    # running the new major against the tree, not by surprise.
    "mypy>=1.11,<3",
    "build",
    # tests/test_linter_is_not_blind.py reads a nested pyproject table, and
    # `tomllib` only joined the standard library in 3.11.
    "tomli; python_version < '3.11'",
    "numpy>=1.24",
    # headless-Chromium checks: scripts/render_gapminder_og.py, the Ralph
    # eyeball loop, gallery-interactivity verification. Needs a one-time
    # `playwright install chromium` after this installs, pip can't do that part.
    "playwright>=1.40",
    # starlette 1.9.0 moved its TestClient onto httpx2. This repository's
    # CI installs `.[dev]` and never reads requirements-dev.txt, so the
    # declaration has to be where the install actually looks.
    "httpx2>=2.0.0",
    # Also in `local`, which is where the feature lives -- the memoized `--local`
    # critique in ralph_eyeball_loop.py. It is repeated here for one reason: CI
    # installs `.[dev]` and not `local`, and
    # tests/test_the_critique_cache_is_addressed_by_content.py skips without
    # wallet_helper. A guard that skips in every CI run is a guard that never
    # runs, and a skip reads as a pass. (`best-engine-ai-helper` is already
    # declared twice, in `editor` and `local`, for the same kind of reason.)
    # Same floor as the base declaration above, for the same reason -- 1.3.1
    # could refuse to open on a cold start.
    "wallet-helper>=1.3.2,<2",
]

[project.scripts]
sprezzature-figures = "sprezzature_figures.cli:main"
make-figure = "sprezzature_figures.cli:main"
sprezzature-figures = "sprezzature_figures.editor.cli:main"
sprezzature-figures-mcp = "sprezzature_figures.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-figures"
Issues = "https://github.com/warith-harchaoui/sprezzature-figures/issues"
Changelog = "https://github.com/warith-harchaoui/sprezzature-figures/blob/main/CHANGELOG.md"

[tool.setuptools]
# Authoritative package-data. Left at its pyproject default of true,
# setuptools sweeps in every file sitting inside a package directory and
# treats package-data as additive, which makes the globs below advisory
# rather than binding -- narrowing one would then change nothing. False is
# what gives this list the last word on what ships.
include-package-data = false
packages = [
    "sprezzature_figures",
    "sprezzature_figures.catalog",
    "sprezzature_figures.core",
    "sprezzature_figures.editor",
    "sprezzature_figures.editor.ingest",
    "sprezzature_figures.editor.assistant",
    "sprezzature_figures.editor.ralph",
    "sprezzature_figures.editor.pages",
    "sprezzature_figures.editor.components",
    "sprezzature_figures.editor.export",
    "sprezzature_figures.editor.recommendation",
    "sprezzature_figures_scripts",
    "sprezzature_figures_fonts",
]

[tool.setuptools.package-dir]
"sprezzature_figures_scripts" = "scripts"
"sprezzature_figures_fonts" = "assets/fonts"

[tool.setuptools.package-data]
"sprezzature_figures.catalog" = ["figures.json"]
# install_figures.py resolves these at runtime to pip-install a tier.
"sprezzature_figures_scripts" = ["requirements-*.txt"]
# Faces listed one family at a time rather than "*.ttf"/"*.woff2", so that
# adding a font to assets/ is a decision taken here rather than a file that
# silently joins the wheel. Every face fonts.OFFERED_FACES names must match
# a glob below; tests/test_the_package_serves_only_fonts_it_ships.py reads
# this list and fails if one does not.
#
# That test is the scar from narrowing these globs to drop Roboto Serif --
# 12.2 MB of an 18.6 MB wheel, for a family no theme sets. The saving was
# real and the reasoning was sound, but fonts.py went on offering the face,
# and a source checkout has every file on disk whatever the wheel contains,
# so nothing here could see the difference. It surfaced in sprezzature-maps'
# CI as `FileNotFoundError: RobotoSerif-Variable.woff2`. The serif is back,
# deliberately: the suite's typography is three Roboto -- sans, serif, mono
# -- and a rule that holds only in a checkout is not a rule.
#
# A licence travels with the font it covers: "OFL-*.txt" matched the three
# Roboto licences but not GUST-FONT-LICENSE-LatinModern.txt, so the four
# Latin Modern faces were once shipping without theirs.
"sprezzature_figures_fonts" = [
    "Roboto-*.ttf",
    "Roboto-*.woff2",
    "RobotoMono-*.ttf",
    "RobotoMono-*.woff2",
    "RobotoSerif-*.ttf",
    "RobotoSerif-*.woff2",
    "LatinModern*.ttf",
    "LatinModern*.woff2",
    "OFL-Roboto.txt",
    "OFL-RobotoMono.txt",
    "OFL-RobotoSerif.txt",
    "GUST-FONT-LICENSE-*.txt",
]

[tool.pytest.ini_options]
# Where the tests live, said out loud: without it a bare `pytest` starts
# collecting at the repository root and sweeps up whatever a build left
# behind -- a `build/` tree, a stray venv, a vendored copy.
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and this is the repository where it matters most --
# four markers deselect 418 of 1714 tests here, so a typo in one of their
# names moves a test between lanes in silence. The whole suite now carries it -- tests/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "--strict-markers -m 'not slow and not packaging and not llm and not vision'"
markers = [
    "slow: tests that render actual figures (may take several seconds)",
    "packaging: builds a wheel and installs it in a fresh venv (network + several seconds)",
    "llm: hits a live text LLM through best-engine-ai-helper (skips if unreachable; never run in CI)",
    "vision: hits a live vision model / VLM through best-engine-ai-helper (skips if unreachable; never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Only generated art is out of scope. `scripts/` and `tests/` used to be
# excluded here too, and that made the gate meaningless: `scripts/` is 82 000
# of this package's 102 000 lines of Python, every make_* generator plus the
# auditor and the eyeball loop, and it ships in the wheel as
# `sprezzature_figures_scripts`. "All checks passed" was green because ruff
# was not looking. It looks now; the noise is handled per-file below rather
# than by hiding the directory.
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    # FastAPI reads a Pydantic model instance in a parameter default as "this
    # body is optional"; it is the framework's own idiom, not a shared mutable.
    "B008",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The 167 generators were written before this repo had a linter. Everything
# that catches a real mistake runs on them -- pyflakes, the bugbear checks,
# ambiguous names, imports stranded mid-module. What is silenced here is
# syntax modernisation and ordering: 3 117 `typing.Dict` -> `dict`, 464
# `Optional[X]` -> `X | None`, 144 import-sort rewrites. Turning those on
# would bury the next real finding under four thousand cosmetic ones, and a
# reformat of that size across live generators is its own decision, not a
# side effect of switching the linter on.
#
# B905 (`zip()` without `strict=`) was silenced here as a named debt and is
# paid off: all 99 call sites are explicit. 85 pair sequences that are
# parallel by construction and say `strict=True`, so a length mismatch raises
# instead of silently dropping the tail and drawing a chart that looks right.
# 14 are sliding pairs (`zip(xs, xs[1:])`) where the short end is the point
# and say `strict=False`. The 167 figures all still render.
"scripts/*" = ["UP", "I001", "C4", "SIM", "W"]
