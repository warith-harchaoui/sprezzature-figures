# `docker compose up` is the whole onboarding. The Dockerfile beside this file
# is a recipe; this is the way in — the port, the volume, the environment and
# the command, declared rather than reconstructed by the next reader from a
# `docker run` line in somebody's shell history.
#
#   docker compose up -d
#   curl -s localhost:8000/health              # the HTTP routes
#   # ...and the MCP endpoint at localhost:8000/mcp, same process, same port
#   docker compose run --rm api sprezzature-figures render bellcurve --out /work/bell.svg
#   docker compose --profile assist up -d     # + the model the eyeball loop
#                                             #   and redraw ask
#
# Two services. The model server is a separate profile: drawing a figure
# needs no model at all, and someone who wants a chart should not be made to
# run one. It is the Ralph eyeball loop's --local mode and redraw that ask.

services:
  api:
    build: .
    image: sprezzature-figures:local
    # Spelled out although it is the image's CMD: one server for the HTTP
    # routes and for /mcp. --host 0.0.0.0, or the published port maps onto
    # the container's own loopback and nothing answers.
    command: ["sprezzature-figures-mcp", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # The package reads OLLAMA_URL; the ollama server reads OLLAMA_HOST.
      # They are not interchangeable, and getting it wrong is invisible until
      # the first call: the default http://localhost:11434 resolves to *this*
      # container, so the API comes up healthy and fails on the first critique.
      OLLAMA_URL: http://ollama:11434
    volumes:
      # The figures written out, and any data file fed in. Mounted rather
      # than copied so the container never holds the only copy.
      - ./work:/work
    working_dir: /work
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Only started with `--profile assist`: the generators need no model.
    profiles: ["assist"]
    ports:
      - "11434:11434"
    volumes:
      # Named volume, not a bind mount: the weights survive `down` and a
      # rebuild, and are not something anyone wants in their working tree.
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ollama-models:
