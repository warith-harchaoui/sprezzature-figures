name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # pyproject declares `requires-python = ">=3.10,<3.14"`. Testing only 3.12
    # is how sprezzature-maps shipped a module that never parsed on 3.10 or
    # 3.11: the floor was a promise nobody checked. Lint and the slow render
    # pass run once, on 3.12; the suite runs on every version promised.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli,dataviz,studio,api,mcp]"

      - name: Lint
        if: matrix.python-version == '3.12'
        # `ruff check .` and not a hand-listed set of directories: the list
        # left out scripts/, four fifths of the package, and named tests/,
        # which the config excluded anyway. Both are linted now.
        run: ruff check .

      # The type half of the gate, added once the package, scripts/ and tools/
      # all reached zero. It is here because running mypy by hand is what
      # found four unguarded `run.io_bound` results in the studio editor:
      # NiceGUI returns None from that call when the client disconnects, so
      # closing a tab mid-render raised AttributeError in the handler.
      # Three roots, three invocations: scripts/ and tools/ import siblings
      # by bare name off a runtime sys.path, which only resolves when that
      # directory is the check's root.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_figures
          mypy scripts
          mypy tools
      - name: "Fast tests (default: excludes slow + packaging)"
        run: python -m pytest -q

      - name: Render tests (renders real figures, still fast)
        if: matrix.python-version == '3.12'
        run: python -m pytest -q -m slow

  packaging:
    name: "Packaging (wheel install, incl. [studio] extra)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Packaging tests (build wheel, install, render, install [studio] extra)
        run: python -m pytest -q -m packaging tests/test_packaging.py
