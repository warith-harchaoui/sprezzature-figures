name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Un push peut ne déclencher aucun run (2.9.2, le 2026-11-05) : on relance
  # alors à la main avec `gh workflow run ci.yml`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 25
    # pyproject declares `requires-python = ">=3.10,<3.14"`. Testing only 3.12
    # is how sprezzature-maps shipped a module that never parsed on 3.10 or
    # 3.11: the floor was a promise nobody checked. Lint and the slow render
    # pass run once, on 3.12; the suite runs on every version promised.
    strategy:
      fail-fast: false
      matrix:
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements-dev.txt

      - name: Lint
        if: matrix.python-version == '3.12'
        # `ruff check .` and not a hand-listed set of directories: the list
        # left out scripts/, four fifths of the package, and named tests/,
        # which the config excluded anyway. Both are linted now.
        run: ruff check .

      # The type half of the gate, added once the package, scripts/ and tools/
      # all reached zero. It is here because running mypy by hand is what
      # found four unguarded `run.io_bound` results in the editor editor:
      # NiceGUI returns None from that call when the client disconnects, so
      # closing a tab mid-render raised AttributeError in the handler.
      # Three roots, three invocations: scripts/ and tools/ import siblings
      # by bare name off a runtime sys.path, which only resolves when that
      # directory is the check's root.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_figures
          mypy scripts
          mypy tools
      - name: "Fast tests (default: excludes slow + packaging)"
        run: python -m pytest -q

      - name: Render tests (renders real figures, still fast)
        if: matrix.python-version == '3.12'
        run: python -m pytest -q -m slow

  packaging:
    name: "Packaging (wheel install, and the editor it now carries)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Takes ~7.5 minutes since 2026-11-01: the extras were folded into the
      # base, so each of the three wheel installs here resolves the whole
      # stack (dowhy, econml, shap, shapash, nicegui) instead of a short
      # list. Measured locally with a warm pip cache; the 25-minute job
      # ceiling above is what it has to fit inside.
      - name: Packaging tests (build the wheel, install it, render, check the editor)
        run: python -m pytest -q -m packaging tests/test_packaging.py

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_figures"
