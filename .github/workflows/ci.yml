name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli,dataviz,studio]"

      - name: Lint
        run: ruff check sprezzature_figures tools tests

      - name: "Fast tests (default: excludes slow + packaging)"
        run: python -m pytest -q

      - name: Render tests (renders real figures, still fast)
        run: python -m pytest -q -m slow
