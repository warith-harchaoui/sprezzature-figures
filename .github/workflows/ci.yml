name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli,dataviz,editor,api,mcp]"

      - name: Lint
        run: ruff check sprezzature_figures tools tests

      - name: "Fast tests (default: excludes slow + packaging)"
        run: python -m pytest -q

      - name: Render tests (renders real figures, still fast)
        run: python -m pytest -q -m slow

  packaging:
    name: "Packaging (wheel install, incl. [editor] extra)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Packaging tests (build wheel, install, render, install [editor] extra)
        run: python -m pytest -q -m packaging tests/test_packaging.py
